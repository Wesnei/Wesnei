name: Gerar Snake e Top Languages

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Enviar para branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  languages:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Gerar grafico de linguagens
        uses: Ricky-11/github-readme-stats-action@v1.0.2
        with:
          username: Wesnei
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: languages-output
          file_name: languages.svg
          card_type: top-langs
          options: "locale=en&hide_title=false&layout=compact&card_width=450&langs_count=6&title_color=00C9FF&text_color=FFFFFF&bg_color=0D1117&border_color=00C9FF&hide_border=false"
